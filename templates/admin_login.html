<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher login · Rosette Exclusive Mock Exam</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <div class="brand">Rosette Exclusive Mock Exam</div>
      <div class="brand-sub">Teacher portal</div>
    </div>
  </header>
  <main class="wrap">
    <section class="card login-box">
      <p class="eyebrow">Teacher access</p>
      <h1>教师后台登录</h1>
      <p class="muted">使用唯一管理员账号登录后，可查看答卷、登录用户，并管理邀请码。</p>
      {% if error %}
      <div class="banner error">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('admin_login') }}">
        <input type="hidden" name="next" value="{{ next }}" />
        <label class="field" style="margin-top:12px">
          Username
          <input type="text" name="username" required autofocus autocomplete="username" />
        </label>
        <label class="field" style="margin-top:12px">
          Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <div class="actions">
          <button type="submit" class="btn">登录</button>
          <a class="btn ghost" href="/">返回模考页</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
